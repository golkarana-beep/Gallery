<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صفحه پیدا نشد · ۴۰۴</title>
<script>try{var t=localStorage.getItem('gal_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f7;--text:#14202b;--muted:#64748b;--accent:#12a594}
[data-theme=dark]{--bg:#0b0f14;--text:#e8eef4;--muted:#8a99aa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:'Vazirmatn',Tahoma,sans-serif;text-align:center;padding:1.5rem;overflow:hidden}
.frame{position:relative;max-width:520px}
.num{font-size:clamp(6rem,26vw,12rem);font-weight:800;line-height:1;letter-spacing:-.04em;background:linear-gradient(135deg,var(--accent),#7aa7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.polaroid{position:absolute;width:90px;height:110px;background:#fff;border-radius:6px;padding:8px 8px 24px;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);transform:rotate(-12deg);inset-inline-start:-40px;top:-30px}
.polaroid i{display:block;width:100%;height:100%;border-radius:3px;background:linear-gradient(160deg,#ffd8a8,#12a594)}
.polaroid.b{inset-inline-start:auto;inset-inline-end:-40px;top:auto;bottom:80px;transform:rotate(10deg)}
.polaroid.b i{background:linear-gradient(160deg,#a8c8e8,#6b5cff)}
p{color:var(--muted);margin:.4rem 0 1.6rem}
a{display:inline-block;background:var(--accent);color:#fff;padding:.7rem 1.6rem;border-radius:999px;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="frame">
  <div class="polaroid"><i></i></div><div class="polaroid b"><i></i></div>
  <div class="num">۴۰۴</div>
  <h1>این قاب خالی است</h1>
  <p>صفحه‌ای که دنبالش بودید وجود ندارد یا جابه‌جا شده است.</p>
  <a id="home" href="/">بازگشت به گالری</a>
</div>
<script>
// برای GitHub Pages (آدرس user.github.io/repo/) مسیر مخزن را از آدرس تشخیص می‌دهیم
(function(){var p=location.pathname.split('/').filter(Boolean),base='/';if(/\.github\.io$/.test(location.hostname)&&p.length)base='/'+p[0]+'/';document.getElementById('home').href=base})();
</script>
</body>
</html>
